<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Late Night Vibes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
   (function() {
  const SCROLL_RANGE = 600;
  const STRIP_START = 320, STRIP_END = 108;
  const DRAWER_START = 260, DRAWER_END = 2;
  const LANDING_START = 420, LANDING_END = 2;

  let outer, inner, strip, drawer, landing, brand, tabs;
  let lastScrollTop = -1;
  let scrollPos = 0;
  let tabsUnlocked = false;
  let layoutLock = null;

  function lerp(a, b, t) { return a + (b - a) * Math.min(1, Math.max(0, t)); }
  function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

  function getEls() {
    outer   = document.getElementById('scroll-outer');
    inner   = document.getElementById('scroll-inner');
    strip   = document.getElementById('lnv-strip');
    drawer  = document.getElementById('lnv-drawer');
    landing = document.getElementById('lnv-landing');
    brand   = document.getElementById('lnv-brand');
    tabs    = document.getElementById('lnv-tabs');
    return !!(outer && inner && strip);
  }

  function updateSpacer() {
    const spacer = document.getElementById('scroll-spacer');
    if (spacer && inner) spacer.style.height = inner.scrollWidth + 'px';
  }

  function tick() {
    requestAnimationFrame(tick);
    if (!strip && !getEls()) return;

    if (inner) inner.scrollLeft = scrollPos;

    if (layoutLock) {
      if (strip)  strip.style.width  = layoutLock.strip  + 'px';
      if (drawer) drawer.style.width = layoutLock.drawer + 'px';
      lastScrollTop = -1;
      return;
    }

    if (scrollPos === lastScrollTop) return;
    lastScrollTop = scrollPos;

    const progress = easeInOut(Math.min(scrollPos / SCROLL_RANGE, 1));

    if (strip)  strip.style.width  = lerp(STRIP_START, STRIP_END, progress) + 'px';
    if (drawer) drawer.style.width = lerp(DRAWER_START, DRAWER_END, progress) + 'px';

    if (landing && !landing.dataset.closed) {
      landing.style.width         = lerp(LANDING_START, LANDING_END, progress) + 'px';
      landing.style.opacity       = lerp(1, 0, Math.min(progress * 2, 1));
      landing.style.pointerEvents = progress > 0.8 ? 'none' : 'auto';
    }

    if (brand) brand.style.opacity = lerp(1, 0.12, Math.min(progress * 2, 1));

    if (tabs) {
      if (!tabsUnlocked && progress > 0.3) tabsUnlocked = true;
      if (tabsUnlocked) {
        tabs.style.opacity = '1';
      } else {
        tabs.style.opacity = String(lerp(0, 1, Math.max(0, (progress - 0.3) / 0.7)));
      }
    }

    const logo = drawer?.querySelector('[data-logo]');
    const hint = drawer?.querySelector('[data-hint]');
    if (logo) {
      logo.style.transform = 'translateX(' + lerp(0, -180, Math.min(progress * 2, 1)) + 'px)';
      logo.style.opacity   = lerp(1, 0, Math.min(progress * 2, 1));
    }
    if (hint) hint.style.opacity = lerp(1, 0, Math.min(progress * 2, 1));
  }

  requestAnimationFrame(tick);

  let velocity = 0;
  const FRICTION = 0.95;
  const MULTIPLIER = 0.15;

  function getMaxScroll() {
    if (!inner) return 3000;
    return Math.max(inner.scrollWidth - window.innerWidth, 600);
  }

  function attachWheel() {
    document.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (layoutLock) layoutLock = null;
      velocity += e.deltaY * MULTIPLIER;
    }, { passive: false });

    function momentumTick() {
      requestAnimationFrame(momentumTick);
      if (Math.abs(velocity) < 0.1) return;
      scrollPos = Math.max(0, Math.min(getMaxScroll(), scrollPos + velocity));
      velocity *= FRICTION;
    }
    requestAnimationFrame(momentumTick);
  }

  attachWheel();

  window.lnvLockLayout = function() {
    layoutLock = { strip: STRIP_END, drawer: DRAWER_START };
  };

  window.lnvUnlockLayout = function() {
    layoutLock = null;
  };

  window.lnvScrollTo = function(pos) {
    scrollPos = pos;
    velocity = 0;
  };

  window.addEventListener('resize', updateSpacer);
  const obs = new MutationObserver(() => {
    if (document.getElementById('scroll-inner')) { updateSpacer(); obs.disconnect(); }
  });
  obs.observe(document.body, { childList: true, subtree: true });
})();
    </script>
  </body>
</html>
