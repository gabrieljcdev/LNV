<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LNV card mockup</title>
<!--
  Card-layout mockup (2026-09-26). Dev-only page, not linked from the app:
  http://localhost:5173/mockup.html. Renders the REAL posts from the backend
  (http://localhost:3001/api/posts) in the candidate templates discussed with
  gabriel, using the site's own palettes (themeService) and fonts, so layouts
  can be judged with real covers and data before any change to Feed.jsx.
-->
<script>
  // Opened as a file (file://)? It can't load the palette module or the posts
  // (the backend's CORS only allows localhost:5173) — go to the served copy.
  if (location.protocol === 'file:') location.replace('http://localhost:5173/mockup.html')
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,300;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root { --sans: 'Barlow', sans-serif; --mono: 'IBM Plex Mono', monospace; --serif: 'Instrument Serif', Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--theme-bg, #111); color: var(--theme-text-pri); font-family: var(--sans); transition: background .6s; }
  #shelf { display: flex; height: 100vh; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  #shelf::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 auto; height: 100vh; position: relative; overflow: hidden; transition: background .6s; }
  .bg1 { background: var(--theme-dark1); } .bg2 { background: var(--theme-dark2); } .bg3 { background: var(--theme-dark3); }
  .bgS { background: var(--theme-showcase); --theme-text-pri: rgba(255,255,255,.92); --theme-text-sec: rgba(255,255,255,.62); --theme-text-ter: rgba(255,255,255,.4); --theme-border: rgba(255,255,255,.16); }
  .tag { position: absolute; top: 14px; right: 16px; z-index: 5; font: 500 10px/1 var(--mono); letter-spacing: .08em; padding: 5px 8px; border-radius: 3px; background: rgba(0,0,0,.55); color: #fff; }
  body.nolabels .tag { display: none; }
  .idx { font: 500 11px/1 var(--mono); letter-spacing: .08em; color: var(--theme-text-sec); }
  .artist { font: 700 38px/1 var(--sans); letter-spacing: -.01em; color: var(--theme-text-pri); }
  .title { font: italic 300 30px/1.1 var(--sans); color: var(--theme-text-pri); }
  .meta { font: 500 11px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--theme-text-sec); }
  .pill { display: inline-block; font: 600 10px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; border-radius: 3px; }
  .p-type { background: var(--theme-showcase); color: #fff; } .p-plat { color: #fff; } .p-line { border: 1px solid var(--theme-border); color: var(--theme-text-sec); }
  .tracks { list-style: none; margin: 0; padding: 0; }
  .tracks li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--theme-border); font: 400 14px/1.25 var(--sans); color: var(--theme-text-sec); cursor: pointer; }
  .tracks li:hover { color: var(--theme-text-pri); }
  .tracks li b { font: 500 11px/1 var(--mono); color: var(--theme-text-ter); font-weight: 500; }
  .tracks li i { font: 400 11px/1 var(--mono); font-style: normal; color: var(--theme-text-ter); }
  .cover { background: #000 center/cover no-repeat; }
  .genres span { display: inline-block; margin: 0 6px 6px 0; font: 500 11px/1 var(--sans); padding: 6px 10px; border-radius: 20px; background: var(--theme-border); color: var(--theme-text-sec); }

  /* Post description — a first-class part of every record card (gabriel,
     2026-09-26: "the description is a key element to the post cards"). */
  .desc h6 { margin: 0 0 8px; font: 500 10px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--theme-text-ter); }
  .desc p { margin: 0; font: 400 16px/1.55 var(--sans); color: var(--theme-text-sec); white-space: pre-line; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .desc p.none { font-style: italic; color: var(--theme-text-ter); }

  /* A — sleeve hero */
  .A { width: 900px; display: flex; flex-direction: column; }
  .A .sleeve { flex: 1; min-height: 0; margin: 48px 48px 0; }
  .A .strip { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) 260px; gap: 34px; padding: 26px 48px 40px; }
  .A .strip .tracks li { font-size: 13px; padding: 4px 0; }

  /* B — back cover */
  .B { width: 760px; padding: 56px 56px 44px; display: flex; flex-direction: column; }
  .B .head { display: flex; gap: 22px; align-items: flex-end; }
  .B .head .cover { width: 150px; height: 150px; flex-shrink: 0; }
  .B .desc { margin-top: 26px; }
  .B .desc p { font-family: var(--serif); font-size: 21px; line-height: 1.35; -webkit-line-clamp: 4; }
  .B .big { flex: 1; min-height: 0; margin-top: 24px; overflow: hidden; }
  .B .big li { grid-template-columns: 44px 1fr auto; font: 500 26px/1.1 var(--sans); letter-spacing: -.01em; color: var(--theme-text-pri); padding: 8px 0; }
  .B .big li b { font-size: 12px; }
  .B .credits { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 16px; padding-top: 18px; border-top: 1px solid var(--theme-text-ter); }
  .B .credits div span { display: block; font: 400 10px/1 var(--mono); color: var(--theme-text-ter); letter-spacing: .1em; margin-bottom: 6px; }
  .B .credits div { font: 500 13px/1.2 var(--sans); color: var(--theme-text-pri); }

  /* C — record out */
  .C { width: 1060px; display: flex; flex-direction: column; justify-content: center; padding: 0 56px; }
  .C .stage { position: relative; height: min(58vh, 560px); }
  .C .disc { position: absolute; top: 3%; left: 0; height: 94%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle, #0c0c0c 0 1.2%, transparent 1.3%), radial-gradient(circle, transparent 0 17%, #111 17.4%),
      repeating-radial-gradient(circle, #151515 0 2px, #0a0a0a 2px 4px);
    box-shadow: 0 0 0 1px rgba(255,255,255,.06) inset; transition: transform 1.1s cubic-bezier(.2,.8,.2,1); }
  .C .disc .label { position: absolute; inset: 32%; border-radius: 50%; background: center/cover no-repeat; }
  .C .disc .label::after { content: ''; position: absolute; left: 50%; top: 50%; width: 7%; height: 7%; margin: -3.5% 0 0 -3.5%; border-radius: 50%; background: #0c0c0c; }
  .C .sleeve { position: absolute; top: 0; left: 0; height: 100%; aspect-ratio: 1; box-shadow: 18px 0 40px rgba(0,0,0,.35); }
  .C .disc { transform: translateX(34%); }
  .C:hover .disc { transform: translateX(62%) rotate(200deg); }
  .C .below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) 340px; gap: 34px; margin-top: 30px; }
  .C .below .tracks { columns: 2; column-gap: 24px; }
  .C .below .tracks li { break-inside: avoid; font-size: 12.5px; padding: 3px 0; grid-template-columns: 28px 1fr; }
  .C .below .tracks li i { display: none; }

  /* D — crate spines */
  .D { display: flex; gap: 0; padding: 0; }
  .spine { width: 132px; height: 100vh; position: relative; border-right: 1px solid var(--theme-border); transition: transform .35s ease, background .6s; cursor: pointer; }
  .spine:hover { transform: translateY(-5vh); }
  .spine .vt { position: absolute; left: 50%; top: 56px; transform: translateX(-50%) rotate(180deg); writing-mode: vertical-rl; white-space: nowrap; max-height: calc(100vh - 290px); overflow: hidden; }
  .spine .vt .artist { font-size: 30px; } .spine .vt .title { font-size: 24px; margin-left: 10px; }
  .spine .cat { position: absolute; left: 0; right: 0; top: 18px; text-align: center; }
  .spine .cover { position: absolute; left: 12px; right: 12px; bottom: 40px; aspect-ratio: 1; }

  /* F — pull quote */
  .F { width: 820px; padding: 64px 64px 48px; display: flex; flex-direction: column; }
  .F .quote { font: 400 44px/1.12 var(--serif); color: var(--theme-text-pri); margin: 18px 0 0; max-height: 52vh; overflow: hidden; }
  .F .quote::before { content: '“'; display: block; font-size: 110px; line-height: .6; color: var(--theme-accent); margin-bottom: 8px; }
  .F .foot { margin-top: auto; display: flex; gap: 22px; align-items: flex-end; }
  .F .foot .cover { width: 190px; height: 190px; flex-shrink: 0; }

  /* G — wide set */
  .G { width: 1240px; padding: 56px 56px 44px; display: flex; flex-direction: column; }
  .G .screen { position: relative; width: 100%; aspect-ratio: 16/9; max-height: 64vh; background: #000 center/cover no-repeat; }
  .G .play { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; }
  .G .play::after { content: ''; border-left: 26px solid #111; border-top: 16px solid transparent; border-bottom: 16px solid transparent; margin-left: 7px; }
  .G .live { position: absolute; left: 18px; top: 18px; }
  .G .under { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 26px; gap: 30px; }
  .G .under .artist { font-size: 64px; letter-spacing: -.02em; }

  /* controls */
  #bar { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 10px; background: rgba(0,0,0,.6); backdrop-filter: blur(6px); font: 500 12px var(--sans); }
  #bar button, #bar select { font: inherit; color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  #bar select option { color: #000; }
  #err { position: fixed; inset: 0; display: grid; place-items: center; font: 500 16px var(--mono); color: #fff; }

  /* Size + scroll experiments (2026-09-26). Cards are designed at full
     height; Medium/Compact shrink them with zoom so 2–5 sit on screen with
     the page background around them as a fixed frame. */
  #shelf { align-items: center; }
  body[data-size="m"] .card { zoom: .7; border-radius: 12px; }
  body[data-size="s"] .card { zoom: .5; border-radius: 14px; }
  body[data-size="m"] #shelf { gap: 28px; padding: 0 56px; }
  body[data-size="s"] #shelf { gap: 22px; padding: 0 44px; }
  body[data-size="m"] .spine:hover, body[data-size="s"] .spine:hover { transform: translateY(-3vh); }
  body[data-scroll="v"] #shelf { flex-wrap: wrap; overflow-x: hidden; overflow-y: auto; align-content: flex-start; justify-content: center; padding-top: 56px; padding-bottom: 80px; }
  #pos { position: fixed; left: 18px; top: 16px; z-index: 50; font: 500 12px/1 var(--mono); letter-spacing: .1em; padding: 7px 10px; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; }
  body[data-scroll="v"] #pos { display: none; }
</style>
</head>
<body>
<div id="shelf"></div>
<div id="pos">01 / 20</div>
<div id="bar">
  <select id="size" title="Card size">
    <option value="f">Full size</option>
    <option value="m" selected>Medium</option>
    <option value="s">Compact</option>
  </select>
  <select id="scroll" title="Scroll feel">
    <option value="glide">Glide (current)</option>
    <option value="snap" selected>Snap</option>
    <option value="v">Vertical</option>
  </select>
  <select id="mode" title="Layout">
    <option value="auto">Auto mix</option>
    <option value="A">All A · sleeve hero</option>
    <option value="B">All B · back cover</option>
    <option value="C">All C · record out</option>
    <option value="F">All F · pull quote</option>
  </select>
  <button id="labels" title="Show/hide template labels">Labels</button>
  <button id="pal" title="Next palette">Palette ◐</button>
</div>
<script type="module">
import { PALETTES, applyPalette, getAutoIndex } from '/src/services/themeService.js'

const API = 'http://localhost:3001/api'
let pal = getAutoIndex(); applyPalette(pal)
document.getElementById('pal').onclick = () => { pal = (pal + 1) % PALETTES.length; applyPalette(pal) }
document.getElementById('labels').onclick = () => document.body.classList.toggle('nolabels')

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const PLAT = { youtube: '#f00', soundcloud: '#f50', bandcamp: '#1da0c3', discogs: '#333', mixcloud: '#5000ff', spotify: '#1db954' }
const ytId = u => (u || '').match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/)?.[1]

function norm(p) {
  const artists = (p.artists || []).map(a => a.artist_name).filter(Boolean)
  const artist = (artists.join(' & ') || '').replace(/ - Topic$/, '')
  const label = p.labels?.[0]?.label_name || ''
  const catno = p.labels?.[0]?.catalogue_number || ''
  const vid = ytId(p.stream_url)
  const isSet = p.post_type === 'livemix' || /\|\s*.+\d{4}|\bb2b\b|dj set|live at|session/i.test(p.title)
  const cover = isSet && vid ? `https://i.ytimg.com/vi/${vid}/maxresdefault.jpg` : (p.cover_image || (vid ? `https://i.ytimg.com/vi/${vid}/hqdefault.jpg` : ''))
  const notes = (p.notes || '').replace(/https?:\/\/\S+/g, '').trim()
  return { p, id: p.id, artist, title: p.title, label, catno, year: p.year || '', tracks: p.tracks || [], genres: p.genres || [], notes, cover, platform: p.platform || '', type: isSet ? 'live set' : (p.post_type || 'single'), isSet, vid }
}

// Template choice from what the post has. Auto mode also avoids repeating a
// template and groups quick posts (≤2 tracks, no notes, not sets) into a
// run of crate spines.
function pick(x) {
  if (x.isSet) return 'G'
  if (x.notes.length > 200) return 'F'
  if (x.tracks.length >= 6) return 'B'
  return 'A'
}
function sequence(items, mode) {
  if (mode !== 'auto') return items.map(x => ({ t: x.isSet ? 'G' : mode, items: [x] }))
  const out = []
  for (let i = 0; i < items.length; i++) {
    const x = items[i]
    let t = pick(x)
    const prev = out[out.length - 1]?.t
    if (t === prev) t = t === 'B' ? 'C' : t === 'A' ? 'C' : t === 'C' ? 'A' : t === 'F' ? 'A' : t
    out.push({ t, items: [x] })
  }
  return out
}

const idxTag = x => `<div class="idx">00-${x.id}</div>`
const pills = x => `<span class="pill p-type">${esc(x.type)}</span> ${x.platform ? `<span class="pill p-plat" style="background:${PLAT[x.platform] || '#444'}">${esc(x.platform)}</span>` : ''} ${x.p.discogs_id ? '<span class="pill p-line">◈ Discogs</span> <span class="pill p-line">Buy ↗</span>' : ''}`
const trackList = (x, n = 99) => `<ul class="tracks">${x.tracks.slice(0, n).map((t, i) => `<li><b>${esc(t.position || i + 1)}</b><span>${esc(t.title)}</span><i>${esc(t.duration || '')}</i></li>`).join('')}${x.tracks.length > n ? `<li><b></b><span>+${x.tracks.length - n} more</span><i></i></li>` : ''}</ul>`
const metaLine = x => [x.label, x.catno, x.year].filter(Boolean).map(esc).join(' · ')
const desc = (x, n = 420) => `<div class="desc"><h6>Post description</h6>${x.notes ? `<p>${esc(x.notes.slice(0, n))}${x.notes.length > n ? '…' : ''}</p>` : '<p class="none">No description yet</p>'}</div>`
const genres = x => x.genres.length ? `<div class="genres">${x.genres.slice(0, 5).map(g => `<span>${esc(g)}</span>`).join('')}</div>` : ''
const TAGS = { A: 'A · sleeve hero', B: 'B · back cover', C: 'C · record out', D: 'D · crate spines', F: 'F · pull quote', G: 'G · wide set' }

const R = {
  A: x => `<div class="sleeve cover" style="background-image:url('${x.cover}')"></div>
    <div class="strip">
      <div>${idxTag(x)}<div style="margin:12px 0 10px">${pills(x)}</div>
        <div class="artist">${esc(x.artist)}</div><div class="title" style="margin-top:4px">${esc(x.title)}</div>
        <div class="meta" style="margin-top:12px">${metaLine(x)}</div></div>
      ${desc(x)}
      <div>${x.tracks.length ? trackList(x, 5) : genres(x)}</div>
    </div>`,
  B: x => `<div class="head"><div class="cover" style="background-image:url('${x.cover}')"></div>
      <div>${idxTag(x)}<div class="artist" style="margin-top:10px;font-size:32px">${esc(x.artist)}</div><div class="title" style="font-size:24px">${esc(x.title)}</div><div style="margin-top:12px">${pills(x)}</div></div></div>
    ${desc(x, 300)}
    <div class="big">${x.tracks.length ? trackList(x, 10) : `<div class="title" style="opacity:.5">No tracklist</div>`}</div>
    <div class="credits"><div><span>LABEL</span>${esc(x.label || '—')}</div><div><span>CAT NO</span>${esc(x.catno || '—')}</div><div><span>YEAR</span>${esc(x.year || '—')}</div></div>`,
  C: x => `<div class="stage"><div class="disc"><div class="label" style="background-image:url('${x.cover}')"></div></div><div class="sleeve cover" style="background-image:url('${x.cover}')"></div></div>
    <div class="below"><div>${idxTag(x)}<div style="margin:12px 0 10px">${pills(x)}</div><div class="artist">${esc(x.artist)}</div><div class="title">${esc(x.title)}</div><div class="meta" style="margin-top:12px">${metaLine(x)}</div></div>
      ${desc(x)}
      <div>${trackList(x, 12)}</div></div>`,
  F: x => `${idxTag(x)}<div class="quote">${esc(x.notes.slice(0, 220))}${x.notes.length > 220 ? '…' : ''}</div>
    <div class="foot"><div class="cover" style="background-image:url('${x.cover}')"></div>
      <div><div style="margin-bottom:10px">${pills(x)}</div><div class="artist">${esc(x.artist)}</div><div class="title">${esc(x.title)}</div><div class="meta" style="margin-top:10px">${metaLine(x)}</div></div></div>`,
  G: x => `<div class="screen" style="background-image:url('${x.cover}')"><span class="pill p-type live">● live set</span><div class="play"></div></div>
    <div class="under"><div>${idxTag(x)}<div class="artist" style="margin-top:10px">${esc(x.artist || x.title.split('|')[0])}</div>
      <div class="title" style="margin-top:6px">${esc(x.title.includes('|') ? x.title.split('|').slice(1).join('|').trim() : x.title)}</div></div>
      <div style="text-align:right">${pills(x)}<div class="meta" style="margin-top:10px">${esc(x.year)}</div></div></div>`,
}
const spine = (x, bg) => `<div class="spine ${bg}"><div class="cat meta">${esc(x.catno || '00-' + x.id)}</div>
  <div class="vt"><span class="artist">${esc(x.artist)}</span><span class="title">${esc(x.title)}</span></div>
  <div class="cover" style="background-image:url('${x.cover}')"></div></div>`

let items = []
function render() {
  const mode = document.getElementById('mode').value
  const bgs = ['bg1', 'bg2', 'bg3', 'bg2', 'bgS', 'bg1', 'bg3']
  document.getElementById('shelf').innerHTML = sequence(items, mode).map((s, i) => {
    const bg = bgs[i % bgs.length]
    if (s.t === 'D') return `<div class="card D">${s.items.map((x, j) => spine(x, bgs[(i + j) % bgs.length] === 'bgS' ? 'bg2' : bgs[(i + j + 1) % bgs.length])).join('')}<div class="tag">${TAGS.D}</div></div>`
    return `<div class="card ${s.t} ${bg}"><div class="tag">${TAGS[s.t]} · #${s.items[0].id}</div>${R[s.t](s.items[0])}</div>`
  }).join('')
}
document.getElementById('mode').onchange = render

// Readable text on every card: the palettes' text colours are set for the
// page as a whole, but a card can sit on a dark swatch in a light palette
// (and vice versa). Pick light or dark ink per card from its actual colour.
function inkFor(el) {
  const m = getComputedStyle(el).backgroundColor.match(/\d+(\.\d+)?/g)
  if (!m) return
  const [r, g, b] = m.map(Number).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4 })
  const dark = 0.2126 * r + 0.7152 * g + 0.0722 * b < 0.35
  const ink = dark ? ['rgba(255,255,255,.94)', 'rgba(255,255,255,.66)', 'rgba(255,255,255,.42)', 'rgba(255,255,255,.14)']
                   : ['rgba(0,0,0,.86)', 'rgba(0,0,0,.6)', 'rgba(0,0,0,.4)', 'rgba(0,0,0,.12)']
  ;['--theme-text-pri', '--theme-text-sec', '--theme-text-ter', '--theme-border'].forEach((v, i) => el.style.setProperty(v, ink[i]))
}
function inkAll() { document.querySelectorAll('.card:not(.D), .spine').forEach(inkFor) }
const _render = render
render = () => { _render(); inkAll(); shelf.scrollLeft = 0; updatePos() }
document.getElementById('mode').onchange = render
document.getElementById('pal').onclick = () => { pal = (pal + 1) % PALETTES.length; applyPalette(pal); document.querySelectorAll('.card, .spine').forEach(el => ['--theme-text-pri', '--theme-text-sec', '--theme-text-ter', '--theme-border'].forEach(v => el.style.removeProperty(v))); setTimeout(inkAll, 650) } // after the 0.6s background fade

// ── Scroll feel ──────────────────────────────────────────────────────────
//   glide: vertical wheel → sideways with the feed's damped lerp (floaty)
//   snap:  one wheel gesture = one card, short eased move, then stillness
//   v:     cards wrap into rows, the page scrolls DOWN natively
const shelf = document.getElementById('shelf')
const sizeSel = document.getElementById('size'), scrollSel = document.getElementById('scroll')
const applyView = () => { document.body.dataset.size = sizeSel.value; document.body.dataset.scroll = scrollSel.value; shelf.scrollTo({ left: 0, top: 0 }); glideTarget = 0; updatePos() }
sizeSel.onchange = applyView; scrollSel.onchange = applyView

let glideTarget = 0, glideRaf = null, snapLock = 0
const cardsEls = () => [...shelf.children]
const leftOf = el => shelf.scrollLeft + el.getBoundingClientRect().left - shelf.getBoundingClientRect().left - parseFloat(getComputedStyle(shelf).paddingLeft || 0)
function glideTick() {
  const d = glideTarget - shelf.scrollLeft
  if (Math.abs(d) < 0.5) { shelf.scrollLeft = glideTarget; glideRaf = null; return }
  shelf.scrollLeft += d * 0.12
  glideRaf = requestAnimationFrame(glideTick)
}
shelf.addEventListener('wheel', e => {
  const mode = scrollSel.value
  if (mode === 'v') return                                   // native vertical scroll
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return       // trackpad sideways swipe: native
  e.preventDefault()
  if (mode === 'glide') {
    glideTarget = Math.max(0, Math.min(glideTarget + e.deltaY * 1.5, shelf.scrollWidth - shelf.clientWidth))
    if (!glideRaf) glideRaf = requestAnimationFrame(glideTick)
    return
  }
  const now = Date.now()
  if (now < snapLock) return                                 // one card per gesture
  snapLock = now + 420
  const cs = cardsEls(), x = shelf.scrollLeft
  const i = cs.findIndex(c => leftOf(c) > x + 4)
  const cur = i === -1 ? cs.length - 1 : Math.max(0, i - 1)
  const next = e.deltaY > 0 ? Math.min(cs.length - 1, i === -1 ? cs.length - 1 : i) : Math.max(0, (Math.abs(leftOf(cs[cur]) - x) < 4 ? cur - 1 : cur))
  shelf.scrollTo({ left: leftOf(cs[next]), behavior: document.hidden ? 'auto' : 'smooth' })
  setTimeout(updatePos, 450)
}, { passive: false })

// Fixed position counter — something on screen that never moves.
const posEl = document.getElementById('pos')
function updatePos() {
  const cs = cardsEls(); if (!cs.length) return
  const x = shelf.scrollLeft + 10
  let n = 0; cs.forEach((c, i) => { if (leftOf(c) <= x) n = i })
  posEl.textContent = `${String(n + 1).padStart(2, '0')} / ${String(cs.length).padStart(2, '0')}`
}
shelf.addEventListener('scroll', updatePos)
document.body.dataset.size = sizeSel.value; document.body.dataset.scroll = scrollSel.value

try {
  const r = await fetch(`${API}/posts?limit=60`)
  const d = await r.json()
  items = (d.posts || d).map(norm)
  render()
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', `<div id="err">Couldn't reach the backend on :3001 — ${esc(e.message)}</div>`)
}
</script>
</body>
</html>
